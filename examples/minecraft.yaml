title: "Why Minecraft Became One of History's Biggest Games"
language: en-US
engine: kokoro
voice: af_heart

scenes:
  - id: hook
    text: >-
      What if I told you that a game made of simple blocks became one of the
      biggest games in history?
    pause_after_ms: 400

  - id: introduction
    text: >-
      No realistic graphics. No complicated story. Just a world where your
      imagination is the limit. This is Minecraft.
    pause_after_ms: 350

  - id: origin
    text: >-
      Released in 2011, Minecraft started as a small indie project created by
      Markus Persson, also known as Notch. The idea was simple: explore,
      collect resources, build anything, and survive.
    pause_after_ms: 300

  - id: possibilities
    text: "But this simple idea created endless possibilities."
    pause_after_ms: 300

  - id: generated-worlds
    text: >-
      Every Minecraft world is randomly generated, meaning every adventure is
      different. Players can build massive castles, automatic machines,
      underground cities, or even recreate famous landmarks from the real
      world.
    pause_after_ms: 300

  - id: ways-to-play
    text: >-
      Some people play Minecraft as a survival game. Others use it as a
      creative tool, a place to design, experiment, and learn.
    pause_after_ms: 300

  - id: freedom
    text: >-
      The reason Minecraft became so popular is freedom. The game does not tell
      you exactly what to do. You decide your own goals.
    pause_after_ms: 300

  - id: exploration
    text: >-
      You can fight dangerous monsters at night, explore mysterious caves,
      discover rare resources, trade with villagers, or simply build something
      beautiful.
    pause_after_ms: 300

  - id: players-as-creators
    text: >-
      Minecraft changed gaming because it turned players from simple consumers
      into creators. Every world becomes a personal story, and every creation
      represents someone's imagination.
    pause_after_ms: 300

  - id: lasting-popularity
    text: >-
      More than a decade later, Minecraft is still loved by millions of players
      around the world.
    pause_after_ms: 300

  - id: lesson
    text: >-
      It proves that a great game does not need the most realistic graphics or
      the most complex systems.
    pause_after_ms: 250

  - id: creative-power
    text: >-
      Sometimes, the most powerful experiences come from giving people the
      freedom to create.
    pause_after_ms: 350

  - id: closing-question
    text: "What would you build if you had an unlimited Minecraft world?"
