name: Build Windows application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "packaging/windows/**"
      - "scripts/build-windows.ps1"
      - "src/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[kokoro,packaging]"
          python -m spacy download en_core_web_sm

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Read application version
        id: app
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Script2Video-Studio-${{ steps.app.outputs.version }}-Windows-x64
          path: release/Script2Video-Studio-${{ steps.app.outputs.version }}-Windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "release/Script2Video-Studio-$env:APP_VERSION-Windows-x64.exe#Windows x64 installer" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Script2Video Studio $env:GITHUB_REF_NAME" `
            --notes "Adds SRT script import: every subtitle cue automatically becomes a narration scene, multiline cues are cleaned, cue gaps become pauses, and the source is preserved as source.srt. Studio now supports Paste text, SRT file, and YAML file workflows. The Kokoro voice model downloads on first use. This installer is currently unsigned, so Windows SmartScreen may show a warning." `
            --verify-tag
