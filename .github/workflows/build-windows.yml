name: Build Windows application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "packaging/**"
      - "scripts/build-windows.ps1"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"
      - name: Install application and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[kokoro,packaging]"
          python -m spacy download en_core_web_sm
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build installer
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Read application version
        id: app
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Script2Video-Studio-${{ steps.app.outputs.version }}-Windows-x64
          path: release/Script2Video-Studio-${{ steps.app.outputs.version }}-Windows-x64.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: Script2Video-Studio-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release create "$GITHUB_REF_NAME" \
            "release/Script2Video-Studio-$APP_VERSION-Windows-x64.exe#Windows x64 installer" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Script2Video Studio $GITHUB_REF_NAME" \
            --notes "Windows-first desktop release with local Kokoro narration, multilingual voices, exact subtitle timing, and CapCut-ready output. macOS remains supported from source; unsigned DMG files are no longer attached to public releases." \
            --verify-tag
