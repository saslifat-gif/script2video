[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "script2video"
version = "1.0.3"
description = "Turn structured scripts into narration assets and timing metadata."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.scripts]
script2video = "script2video.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "numpy>=1.26",
  "pytest>=8.2",
  "ruff>=0.5",
]
kokoro = [
  "kokoro>=0.9.4,<1",
  "numpy>=1.26",
]
alignment = [
  "mlx-whisper>=0.4.3,<1",
]
packaging = [
  "pillow>=11,<13",
  "pyinstaller>=6.21,<7",
  "pywebview>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/script2video"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["script2video"]
